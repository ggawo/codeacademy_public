<!-- Language: HTML -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <link rel="icon" href="volleyball.jpg" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volleyball Universe | Ultimate Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff6b00;
            --secondary: #1a1a2e;
            --light: #f8f9fa;
            --dark: #121212;
            --gray: #e0e0e0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--light);
            color: var(--dark);
            scroll-behavior: smooth;
        }

        /* Header & Nav */
        header {
            background: var(--secondary);
            color: white;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            cursor: pointer;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 1.5rem;
        }

        nav button {
            background: none;
            border: none;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 400;
            transition: color 0.3s;
        }

        nav button:hover, nav button.active {
            color: var(--primary);
            font-weight: 600;
        }

        /* Search Bar Section */
        .search-container {
            background: linear-gradient(135deg, var(--secondary), #2d2d56);
            padding: 3rem 1rem;
            text-align: center;
            color: white;
        }

        .search-container h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .search-container p {
            margin-bottom: 1.5rem;
            color: #cfcfcf;
        }

        .search-box {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            border-radius: 30px;
            overflow: hidden;
            background: white;
        }

        .search-box input {
            flex: 1;
            padding: 1rem 1.5rem;
            border: none;
            outline: none;
            font-size: 1rem;
        }

        .search-box button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 2rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .search-box button:hover {
            background: #e05e00;
        }

        /* Main Content Layout */
        .main-content {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 2rem;
        }

        .page-section {
            display: none; /* Controlled by JS tab switcher */
        }

        .page-section.active-page {
            display: block;
        }

        .section-title {
            font-size: 2rem;
            margin-bottom: 2rem;
            color: var(--secondary);
            border-left: 5px solid var(--primary);
            padding-left: 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        .card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s;
            border-top: 4px solid var(--primary);
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-body {
            padding: 1.5rem;
        }

        .card-body h3 {
            margin-bottom: 0.5rem;
            color: var(--secondary);
        }

        .card-body p {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }

        .tag {
            display: inline-block;
            background: var(--gray);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--secondary);
        }

        /* Search Results Panel */
        #search-results-section {
            margin-top: 2rem;
        }

        .hidden {
            display: none !important;
        }

        /* Footer */
        footer {
            background: var(--secondary);
            color: white;
            text-align: center;
            padding: 2rem;
            margin-top: 4rem;
        }
    </style>
</head>
<body>

    <!-- Header & Navigation -->
    <header>
        <div class="logo" onclick="switchPage('home', event)">🏐 Volleyball Universe</div>
        <nav>
            <ul>
                <li><button onclick="switchPage('home', event)" class="active" id="nav-home">Home</button></li>
                <li><button onclick="switchPage('clothes', event)" id="nav-clothes">Clothes & Gear</button></li>
                <li><button onclick="switchPage('matches', event)" id="nav-matches">Matches</button></li>
                <li><button onclick="switchPage('players', event)" id="nav-players">Top Players</button></li>
                <li><button onclick="switchPage('equipment', event)" id="nav-equipment">Equipment</button></li>
            </ul>
        </nav>
    </header>

    <!-- Search Hero Section -->
    <div class="search-container">
        <h1>Find Your Volleyball Essentials</h1>
        <p>Search across clothes, legendary players, iconic matches, and gear instantly!</p>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Try searching 'shoes', 'libero', 'finals', 'knee pads'..." onkeyup="filterContent()">
            <button onclick="filterContent()">Search</button>
        </div>
    </div>

    <!-- Live Search Results Container -->
    <div class="main-content" id="search-results-section" style="display:none;">
        <h2 class="section-title">Search Results</h2>
        <div class="grid" id="search-results-grid">
            <!-- Dynamic search matches populate here -->
        </div>
        <hr style="margin: 3rem 0; border: 0; border-top: 1px solid #ccc;">
    </div>

</body>

</html>
