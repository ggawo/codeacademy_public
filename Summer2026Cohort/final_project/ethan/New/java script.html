  <script>
        const showTableBtn = document.getElementById('show-Table-btn');
        const ethioMapDiv = document.getElementById('ethio-map');

        showEthioMapBtn.addEventListener('click', function() {
            const isHidden = ethioMapDiv.hidden;
            ethioMapDiv.hidden = !isHidden;
            showTableBtn.textContent = isHidden ? 'Hide Table' : 'Show Table';
            showTableBtn.setAttribute('aria-expanded', String(isHidden));
        });
